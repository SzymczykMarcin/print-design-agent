[project]
name = "print-design-agent"
version = "0.1.0"
description = "Skills and tools for promotional design and print inspection."
authors = [{ name = "SzymczykMarcin" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.24",
    "vtracer==0.6.15",
    "Pillow>=10.0",
    "resvg-cli>=0.44",
    "reportlab>=5.0",
    "svglib>=2.0",
    "pypdf (>=6.19.0,<7.0.0)",
]

[project.scripts]
logo-vectorizer = "logo_vectorizer.cli:main"

[tool.poetry]
packages = [{ include = "logo_vectorizer", from = "tools/logo-vectorizer/src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tools/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tools/logo-vectorizer/tests"]
