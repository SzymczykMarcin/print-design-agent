[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logo-vectorizer"
version = "0.1.0"
description = "A practical raster logo vectorizer that exports editable SVG and vector PDF files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "vtracer==0.6.15",
    "Pillow>=10.0",
    "resvg-cli>=0.44",
    "reportlab>=5.0",
    "svglib>=2.0",
]

[project.optional-dependencies]
quality = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
logo-vectorizer = "logo_vectorizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
